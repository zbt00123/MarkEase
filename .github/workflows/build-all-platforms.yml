name: Build all platforms

# ★ 一键打全平台（推荐入口）
#
# 运行一次即并行构建：
#   - Windows x64   : MarkEase_v<ver>_Windows_x64_portable.zip
#   - Linux x64     : MarkEase_v<ver>_Linux_x64.tar.gz + .deb
#   - macOS Intel   : MarkEase_v<ver>_macOS_x64.dmg
#   - macOS ARM64   : MarkEase_v<ver>_macOS_arm64.dmg
#
# 触发：
#   - 手动 workflow_dispatch（在 Actions 页面点一次即可）
#   - 推送 v* 标签（发版自动构建）
#
# 实现方式：复用两个已有工作流（workflow_call），不重复维护构建步骤。
#   - build-windows.yml      只跑 Windows
#   - build-linux-macos.yml  只跑 Linux / macOS
# 两者仍可单独手动运行，便于只验证某一个平台。

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  windows-x64:
    name: windows-x64
    uses: ./.github/workflows/build-windows.yml
    secrets: inherit

  linux-x64:
    name: linux-x64
    uses: ./.github/workflows/build-linux-macos.yml
    secrets: inherit
