name: Build all platforms

# MarkEase 唯一构建入口：一次运行生成 Windows / Linux / macOS（Intel + ARM）。
# 触发：手动 workflow_dispatch，或推送 v* 标签。
# 说明：PyInstaller 不能交叉编译，四个目标分别在各自原生 runner 上构建。

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  # ============================================================
  #  Windows x64
  # ============================================================
  windows-x64:
    name: windows-x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build (PyInstaller)
        run: python -m PyInstaller --clean --noconfirm MarkEase.spec

      - name: Verify build output
        shell: pwsh
        run: |
          $exe = 'dist/MarkEase/MarkEase.exe'
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          if (-not (Test-Path 'dist/MarkEase/MarkEase.exe.config')) {
            throw 'missing MarkEase.exe.config (needed by pythonnet on non-ASCII paths)'
          }
          if (-not (Test-Path 'dist/MarkEase/_internal/pythonnet/runtime/Python.Runtime.dll')) {
            throw 'missing pythonnet runtime'
          }
          if (-not (Test-Path 'dist/MarkEase/_internal/web/index.html')) {
            throw 'missing web assets'
          }

      - name: Package portable zip
        shell: pwsh
        run: |
          $ver = python -c "import re;print('.'.join(re.search(r'filevers=\((\d+),\s*(\d+),\s*(\d+)', open('version_info.txt', encoding='utf-8').read()).groups()))"
          New-Item -ItemType Directory -Force out | Out-Null
          $zip = "out/MarkEase_v${ver}_Windows_x64_portable.zip"
          Compress-Archive -Path 'dist/MarkEase' -DestinationPath $zip -CompressionLevel Optimal
          Write-Host "artifact: $zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: markease-windows-x64
          path: out/*.zip
          if-no-files-found: error
          compression-level: 0

  # ============================================================
  #  Linux x64 / macOS Intel / macOS Apple Silicon
  # ============================================================
  unix:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            target: linux-x64
            arch: ''
          - name: macos-x64
            os: macos-15-intel
            target: macos-x64
            arch: x86_64
          - name: macos-arm64
            os: macos-26
            target: macos-arm64
            arch: arm64

    runs-on: ${{ matrix.os }}
    env:
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config gobject-introspection \
            libglib2.0-dev libgirepository1.0-dev libffi-dev \
            libcairo2-dev libpango1.0-dev \
            libgtk-3-dev libwebkit2gtk-4.0-dev \
            gir1.2-gtk-3.0 gir1.2-webkit2-4.0 \
            xvfb

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
          if [ "${{ runner.os }}" = "macOS" ]; then
            python -m pip install dmgbuild
          fi

      - name: Import Developer ID certificate (optional)
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE_P12 != ''
        env:
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN=/tmp/markease-signing.keychain
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > /tmp/markease-cert.p12
          security create-keychain -p actions "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          security import /tmp/markease-cert.p12 -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k actions "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build (PyInstaller)
        env:
          MK_TARGET_ARCH: ${{ matrix.arch }}
        run: |
          if [ "${{ matrix.target }}" = "linux-x64" ]; then
            python -m PyInstaller --clean --noconfirm packaging/linux.spec
          else
            python -m PyInstaller --clean --noconfirm packaging/macos.spec
          fi

      - name: Verify build output (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          test -x dist/MarkEase/MarkEase
          test -f dist/MarkEase/_internal/web/index.html
          # 构建机的 GTK / GLib / libstdc++ 不能进产物：在更新的发行版上
          # 它们会顶掉系统同名库，WebKit 因符号版本不满足而加载失败。
          leaked=$(find dist/MarkEase/_internal -maxdepth 1 \
            \( -name 'libgtk-3.so*' -o -name 'libglib-2.0.so*' \
               -o -name 'libstdc++.so*' -o -name 'libgio-2.0.so*' \
               -o -name 'libgobject-2.0.so*' -o -name 'libicu*' \) \
            -printf '%f\n' || true)
          if [ -n "$leaked" ]; then
            echo "::error::system libraries got bundled into _internal: $leaked"
            exit 1
          fi
          xvfb-run -a dist/MarkEase/MarkEase --self-test
          dist/MarkEase/MarkEase --net-test

      - name: Verify build output (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          APP=dist/MarkEase.app
          test -d "$APP"
          test -f "$APP/Contents/Info.plist"
          test -f "$APP/Contents/MacOS/MarkEase"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
            "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c \
            'Print :CFBundleDocumentTypes:0:LSItemContentTypes:0' \
            "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c \
            'Print :UTExportedTypeDeclarations:0:UTTypeIdentifier' \
            "$APP/Contents/Info.plist"
          plutil -lint "$APP/Contents/Info.plist"
          "$APP/Contents/MacOS/MarkEase" --self-test
          "$APP/Contents/MacOS/MarkEase" --net-test

      - name: GUI smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          set +e
          timeout 45s xvfb-run -a dist/MarkEase/MarkEase --ui-test \
            2>&1 | tee /tmp/markease-ui-test.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::error::--ui-test failed with code $code"
            exit 1
          fi
          grep -q '"initialized": true' /tmp/markease-ui-test.log
          if grep -q '"toolbarButtons": 0' /tmp/markease-ui-test.log; then
            echo "::error::toolbar did not initialize"
            exit 1
          fi

      - name: GUI smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          set +e
          dist/MarkEase.app/Contents/MacOS/MarkEase --ui-test \
            2>&1 | tee /tmp/markease-ui-test.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::error::--ui-test failed with code $code"
            exit 1
          fi
          grep -q '"initialized": true' /tmp/markease-ui-test.log
          grep -q '"menubarVisible": true' /tmp/markease-ui-test.log

      - name: Find bar drag/bounds test (Linux)
        if: runner.os == 'Linux'
        run: |
          set +e
          timeout 45s xvfb-run -a dist/MarkEase/MarkEase --find-test \
            2>&1 | tee /tmp/markease-find-test.log
          code=${PIPESTATUS[0]}
          set -e
          cat /tmp/markease-find-test.log
          if [ "$code" -ne 0 ]; then
            echo "::error::--find-test failed with code $code"
            exit 1
          fi

      - name: Find bar drag/bounds test (macOS)
        if: runner.os == 'macOS'
        run: |
          set +e
          dist/MarkEase.app/Contents/MacOS/MarkEase --find-test \
            2>&1 | tee /tmp/markease-find-test.log
          code=${PIPESTATUS[0]}
          set -e
          cat /tmp/markease-find-test.log
          if [ "$code" -ne 0 ]; then
            echo "::error::--find-test failed with code $code"
            exit 1
          fi

      - name: PDF smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          set +e
          timeout 90s xvfb-run -a dist/MarkEase/MarkEase \
            --pdf-test /tmp/markease-test.pdf 2>&1 | tee /tmp/markease-pdf.log
          code=${PIPESTATUS[0]}
          set -e
          cat /tmp/markease-pdf.log
          if [ "$code" -ne 0 ]; then
            echo "::error::--pdf-test failed with code $code"
            exit 1
          fi
          test -s /tmp/markease-test.pdf

      - name: PDF smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          set +e
          dist/MarkEase.app/Contents/MacOS/MarkEase \
            --pdf-test /tmp/markease-test.pdf 2>&1 | tee /tmp/markease-pdf.log
          code=${PIPESTATUS[0]}
          set -e
          cat /tmp/markease-pdf.log
          if [ "$code" -ne 0 ]; then
            echo "::error::--pdf-test failed with code $code"
            exit 1
          fi
          test -s /tmp/markease-test.pdf

      - name: Close/quit smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          set +e
          dist/MarkEase.app/Contents/MacOS/MarkEase --close-test \
            2>&1 | tee /tmp/markease-close.log
          code=${PIPESTATUS[0]}
          set -e
          cat /tmp/markease-close.log
          if [ "$code" -ne 0 ]; then
            echo "::error::--close-test failed with code $code"
            exit 1
          fi

      # --quit-test 走"正常关窗"路径（不 force_close）：旧版在 webview.start()
      # 返回后会卡在解释器收尾的线程 join 上，macOS 报 hang。这里直接兜住。
      - name: Quit smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          set +e
          timeout 90s dist/MarkEase.app/Contents/MacOS/MarkEase --quit-test \
            2>&1 | tee /tmp/markease-quit.log
          code=${PIPESTATUS[0]}
          set -e
          cat /tmp/markease-quit.log
          if [ "$code" -ne 0 ]; then
            echo "::error::--quit-test failed with code $code"
            exit 1
          fi

      - name: Quit smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          set +e
          timeout 90s xvfb-run -a dist/MarkEase/MarkEase --quit-test \
            2>&1 | tee /tmp/markease-quit-linux.log
          code=${PIPESTATUS[0]}
          set -e
          cat /tmp/markease-quit-linux.log
          if [ "$code" -ne 0 ]; then
            echo "::error::--quit-test failed with code $code"
            exit 1
          fi

      - name: Verify PDF colors/layout (macOS)
        if: runner.os == 'macOS'
        run: |
          python - <<'PY'
          import pymupdf
          doc = pymupdf.open('/tmp/markease-test.pdf')
          assert doc.page_count >= 2, f'only {doc.page_count} page(s)'
          for index in (0, doc.page_count - 1):
              page = doc[index]
              pix = page.get_pixmap(matrix=pymupdf.Matrix(0.5, 0.5),
                                    alpha=False)
              points = [(3, 3), (pix.width - 4, 3),
                        (3, pix.height - 4),
                        (pix.width - 4, pix.height - 4)]
              for x, y in points:
                  rgb = pix.pixel(x, y)[:3]
                  assert sum(rgb) / 3 > 180, (
                      f'page {index} corner ({x},{y}) is dark: {rgb}')
          text = ''.join(p.get_text() for p in doc)
          assert '替换为' not in text and '查找' not in text, \
              'find bar text leaked into PDF'
          print(f'pdf layout ok: {doc.page_count} pages, light background')
          PY

      - name: Open-file smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          set +e
          printf '# MarkEase open test\n\nhello\n' > /tmp/markease-open-test.md
          dist/MarkEase.app/Contents/MacOS/MarkEase \
            --open-file-test /tmp/markease-open-test.md \
            2>&1 | tee /tmp/markease-open-file.log
          code=${PIPESTATUS[0]}
          set -e
          cat /tmp/markease-open-file.log
          if [ "$code" -ne 0 ]; then
            echo "::error::--open-file-test failed with code $code"
            exit 1
          fi

      - name: Package
        env:
          MK_CODESIGN_IDENTITY: ${{ secrets.MAC_CODESIGN_IDENTITY }}
          MK_NOTARIZE: ${{ secrets.APPLE_ID != '' && '1' || '0' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          python packaging/package.py \
            --target ${{ matrix.target }} --dist dist --out out

      - name: Verify dmg contents (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          DMG=$(ls out/*.dmg)
          MOUNT=/tmp/markease_dmg
          mkdir -p "$MOUNT"
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT"
          trap 'hdiutil detach "$MOUNT" -force >/dev/null 2>&1 || true' EXIT
          test -d "$MOUNT/MarkEase.app"
          test -L "$MOUNT/Applications"
          test -f "$MOUNT/.DS_Store"
          find "$MOUNT" -iname '*background*' | grep -q .
          echo 'dmg layout assets: ok'

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: markease-${{ matrix.name }}
          path: |
            out/*.tar.gz
            out/*.deb
            out/*.dmg
            out/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0

  # ============================================================
  #  .deb 安装冒烟测试：在比构建机（ubuntu-22.04）更新的 LTS 上装包并启动。
  #
  #  v2.1.7 的故障：产物里打了 ubuntu-22.04 的 libstdc++.so.6 / GLib 2.72，
  #  在 Ubuntu 26.04 上顶掉系统库，libicui18n 需要 CXXABI_1.3.15 而包里没有，
  #  WebKit typelib 加载失败 → 点图标无反应。裸 dist/ 的测试查不出这类问题，
  #  必须安装 .deb 后跑一次。
  # ============================================================
  linux-deb-on-newer-distro:
    name: linux-deb (ubuntu-24.04)
    needs: unix
    runs-on: ubuntu-24.04
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v7
        with:
          name: markease-linux-x64
          path: out

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb

      - name: Install the .deb
        run: |
          set -euo pipefail
          sudo apt-get install -y ./out/*.deb
          dpkg -s markease | grep -E '^(Status|Version|Depends):'

      - name: Assert no build-host system libraries
        run: |
          set -euo pipefail
          leaked=$(find /opt/markease/_internal -maxdepth 1 \
            \( -name 'libgtk-3.so*' -o -name 'libglib-2.0.so*' \
               -o -name 'libstdc++.so*' -o -name 'libgio-2.0.so*' \
               -o -name 'libgobject-2.0.so*' -o -name 'libicu*' \) \
            -printf '%f\n' || true)
          if [ -n "$leaked" ]; then
            echo "::error::build-host system libraries leaked into the .deb: $leaked"
            exit 1
          fi
          echo 'bundle is free of build-host system libraries'

      - name: GUI smoke test from the installed .deb
        run: |
          set +e
          timeout 60s xvfb-run -a /opt/markease/MarkEase --ui-test \
            2>&1 | tee /tmp/deb-ui-test.log
          code=${PIPESTATUS[0]}
          set -e
          cat /tmp/deb-ui-test.log
          if [ "$code" -ne 0 ]; then
            echo "::error::installed .deb failed --ui-test with code $code"
            exit 1
          fi
          grep -q '"initialized": true' /tmp/deb-ui-test.log
          echo 'installed .deb launches and initializes the UI'

  # ============================================================
  #  Linux legacy（麒麟 V10 / Debian 11，glibc 2.31）
  #  debian:11 容器 + python-build-standalone（glibc 2.17）；
  #  MK_LINUX_LEGACY=1 额外带上 libffi.so.8 / libssl.so.3（老系统没有）。
  #
  #  ★ UOS 20（glibc 2.28 / glib 2.58）覆盖不到：PyGObject 3.50 要求
  #    glib >= 2.64，buster 只有 2.58；要支持得另做一套更老 Python 的产物。
  #  这条线仍在收敛，先 continue-on-error，不拖红正式发布。
  # ============================================================
  linux-legacy-x64:
    name: linux-legacy-x64 (debian:11)
    continue-on-error: true
    runs-on: ubuntu-22.04
    container:
      image: debian:11
    # 容器里默认 shell 是 dash，不支持 `set -o pipefail`。
    defaults:
      run:
        shell: bash
    steps:
      # bullseye 已进入 archive，且镜像里没有 git（checkout 需要）。
      - name: Bootstrap container (archive apt sources + git)
        run: |
          printf '%s\n' \
            'deb http://archive.debian.org/debian bullseye main contrib' \
            'deb http://archive.debian.org/debian-security bullseye-security main contrib' \
            > /etc/apt/sources.list
          printf 'Acquire::Check-Valid-Until "false";\nAcquire::Retries "3";\n' \
            > /etc/apt/apt.conf.d/99markease-archive
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          apt-get install -y --no-install-recommends \
            build-essential pkg-config curl xz-utils file \
            libglib2.0-dev libgirepository1.0-dev libffi-dev \
            libcairo2-dev libpango1.0-dev \
            libgtk-3-dev libwebkit2gtk-4.0-dev \
            gir1.2-gtk-3.0 gir1.2-webkit2-4.0 \
            flex bison ninja-build python3-mako python3-pip \
            xvfb dbus libgl1-mesa-dri

      # buster 只有 gobject-introspection 1.58，PyGObject 3.50 要求 glib >= 2.64，
      # 所以 legacy 基线选 bullseye（glib 2.66 / GI 1.66 / glibc 2.31）。

      - name: Install python-build-standalone 3.14 (glibc 2.17 baseline)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          URL=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/astral-sh/python-build-standalone/releases/latest \
            | grep -o 'https://[^"]*cpython-3\.14\.[^"]*-x86_64-unknown-linux-gnu-install_only\.tar\.gz' \
            | head -1)
          if [ -z "$URL" ]; then
            echo "::error::no cpython 3.14 x86_64-unknown-linux-gnu build found"
            exit 1
          fi
          echo "python: $URL"
          mkdir -p /opt/py
          curl -fsSL "$URL" | tar -xz -C /opt/py --strip-components=1
          /opt/py/bin/python3 --version
          echo /opt/py/bin >> "$GITHUB_PATH"

      - name: Assert the interpreter really is glibc <= 2.28
        run: |
          set -euo pipefail
          max_of() {
            strings "$1" | grep -oE 'GLIBC_2\.[0-9]+' | sort -uV | tail -1
          }
          echo "python3.14: $(max_of /opt/py/bin/python3.14)"
          lib=$(ls /opt/py/lib/libpython3.14.so* 2>/dev/null | head -1 || true)
          if [ -n "$lib" ]; then
            echo "libpython:  $(max_of "$lib")"
            max=$(max_of "$lib")
          else
            max=$(max_of /opt/py/bin/python3.14)
          fi
          case "$max" in
            GLIBC_2.1?|GLIBC_2.2?) echo "baseline ok: $max" ;;
            *) echo "::error::unexpected baseline $max"; exit 1 ;;
          esac

      - name: Install Python dependencies
        env:
          PKG_CONFIG_PATH: /usr/local/lib/pkgconfig:/usr/local/lib/x86_64-linux-gnu/pkgconfig
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt pyinstaller
          python3 -c "import gi, webview; print('gi', gi.__version__); print('pywebview', webview.__version__)"

      # buster 的 WebKit2 是 2.30 一代，比 jammy 的 2.44 老不少。
      # evaluate_javascript 是 2.40 才有的 API，pywebview 在老版本上会退回
      # run_javascript —— 这里把实际能力打出来，以后排查省事。
      - name: Record GTK / WebKit2 capability
        run: |
          python3 - <<'PY'
          import gi
          gi.require_version('Gtk', '3.0')
          gi.require_version('WebKit2', '4.0')
          from gi.repository import Gtk, WebKit2

          print('GTK     %d.%d.%d' % (Gtk.get_major_version(),
                                      Gtk.get_minor_version(),
                                      Gtk.get_micro_version()))
          print('WebKit2 %d.%d.%d' % (WebKit2.get_major_version(),
                                      WebKit2.get_minor_version(),
                                      WebKit2.get_micro_version()))
          print('WebView.evaluate_javascript:',
                hasattr(WebKit2.WebView, 'evaluate_javascript'))
          PY

      - name: Build (PyInstaller, legacy library set)
        env:
          MK_LINUX_LEGACY: '1'
        run: python3 -m PyInstaller --clean --noconfirm packaging/linux.spec

      - name: Verify bundle (ABI + no build-host system libraries)
        run: |
          set -euo pipefail
          test -x dist/MarkEase/MarkEase
          test -f dist/MarkEase/_internal/web/index.html
          target=dist/MarkEase/_internal/libpython3.14.so.1.0
          [ -f "$target" ] || target=dist/MarkEase/MarkEase
          max=$(strings "$target" | grep -oE 'GLIBC_2\.[0-9]+' | sort -uV | tail -1)
          echo "bundled runtime requires $max"
          case "$max" in
            GLIBC_2.1?|GLIBC_2.2?) echo "baseline ok: $max" ;;
            *) echo "::error::bundle needs $max, too new for UOS 20 / Kylin V10"; exit 1 ;;
          esac
          leaked=$(find dist/MarkEase/_internal -maxdepth 1 \
            \( -name 'libgtk-3.so*' -o -name 'libglib-2.0.so*' \
               -o -name 'libstdc++.so*' -o -name 'libgio-2.0.so*' \
               -o -name 'libgobject-2.0.so*' -o -name 'libicu*' \) \
            -printf '%f\n' || true)
          if [ -n "$leaked" ]; then
            echo "::error::system libraries got bundled: $leaked"
            exit 1
          fi
          for lib in libffi.so.8 libssl.so.3 libcrypto.so.3 libgirepository-1.0.so.1; do
            if [ -e "dist/MarkEase/_internal/$lib" ]; then
              echo "bundled: $lib"
            else
              echo "::warning::not bundled: $lib (must exist on the target system)"
            fi
          done

      - name: Headless self-test
        run: dist/MarkEase/MarkEase --self-test

      - name: Package legacy tar.gz + .deb
        run: |
          python3 packaging/package.py --target linux-x64 --dist dist --out out \
            --variant legacy
          ls -lh out
          dpkg-deb -I out/*_legacy.deb \
            | grep -E '^ (Package|Version|Architecture|Depends):'

      - name: Install the .deb and verify it configures
        run: |
          set -euo pipefail
          apt-get install -y --no-install-recommends ./out/*_legacy.deb
          dpkg -s markease | grep -E '^(Status|Version):'
          dpkg -L markease | grep -E 'markease.desktop|/opt/markease/MarkEase$'

      - name: Self-test from the installed package
        run: /opt/markease/MarkEase --self-test

      # 容器里没有 GPU，WebKit 的 user-namespace 沙箱也不可用；这一步先作为
      # 观察项。第一次跑通后删掉 continue-on-error，让它变成硬门槛。
      - name: GUI smoke test (best effort)
        continue-on-error: true
        env:
          WEBKIT_FORCE_SANDBOX: '0'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set +e
          timeout 120s dbus-run-session -- xvfb-run -a \
            /opt/markease/MarkEase --ui-test 2>&1 | tee /tmp/legacy-ui-test.log
          code=${PIPESTATUS[0]}
          set -e
          cat /tmp/legacy-ui-test.log
          grep -q '"initialized": true' /tmp/legacy-ui-test.log || exit 1
          test "$code" -eq 0

      - name: Collect diagnostics on failure
        if: failure()
        run: |
          echo '--- app log ---'
          tail -120 ~/.local/state/markease/logs/markease.log 2>/dev/null || true
          echo '--- webkit on this image ---'
          ldconfig -p | grep -i webkit || true

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: markease-linux-x64-legacy
          path: |
            out/*_legacy.tar.gz
            out/*_legacy.deb
          if-no-files-found: error
          compression-level: 0
