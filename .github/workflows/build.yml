name: Build all platforms

# MarkEase 唯一构建入口：一次运行生成 Windows / Linux / macOS（Intel + ARM）。
# 触发：手动 workflow_dispatch，或推送 v* 标签。
# 说明：PyInstaller 不能交叉编译，四个目标分别在各自原生 runner 上构建。

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  # ============================================================
  #  Windows x64
  # ============================================================
  windows-x64:
    name: windows-x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build (PyInstaller)
        run: python -m PyInstaller --clean --noconfirm MarkEase.spec

      - name: Verify build output
        shell: pwsh
        run: |
          $exe = 'dist/MarkEase/MarkEase.exe'
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          if (-not (Test-Path 'dist/MarkEase/MarkEase.exe.config')) {
            throw 'missing MarkEase.exe.config (needed by pythonnet on non-ASCII paths)'
          }
          if (-not (Test-Path 'dist/MarkEase/_internal/pythonnet/runtime/Python.Runtime.dll')) {
            throw 'missing pythonnet runtime'
          }
          if (-not (Test-Path 'dist/MarkEase/_internal/web/index.html')) {
            throw 'missing web assets'
          }

      - name: Package portable zip
        shell: pwsh
        run: |
          $ver = python -c "import re;print('.'.join(re.search(r'filevers=\((\d+),\s*(\d+),\s*(\d+)', open('version_info.txt', encoding='utf-8').read()).groups()))"
          New-Item -ItemType Directory -Force out | Out-Null
          $zip = "out/MarkEase_v${ver}_Windows_x64_portable.zip"
          Compress-Archive -Path 'dist/MarkEase' -DestinationPath $zip -CompressionLevel Optimal
          Write-Host "artifact: $zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: markease-windows-x64
          path: out/*.zip
          if-no-files-found: error
          compression-level: 0

  # ============================================================
  #  Linux x64 / macOS Intel / macOS Apple Silicon
  # ============================================================
  unix:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            target: linux-x64
            arch: ''
          - name: macos-x64
            os: macos-15-intel
            target: macos-x64
            arch: x86_64
          - name: macos-arm64
            os: macos-26
            target: macos-arm64
            arch: arm64

    runs-on: ${{ matrix.os }}
    env:
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config gobject-introspection \
            libglib2.0-dev libgirepository1.0-dev libffi-dev \
            libcairo2-dev libpango1.0-dev \
            libgtk-3-dev libwebkit2gtk-4.0-dev \
            gir1.2-gtk-3.0 gir1.2-webkit2-4.0 \
            xvfb

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
          if [ "${{ runner.os }}" = "macOS" ]; then
            python -m pip install dmgbuild
          fi

      - name: Import Developer ID certificate (optional)
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE_P12 != ''
        env:
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN=/tmp/markease-signing.keychain
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > /tmp/markease-cert.p12
          security create-keychain -p actions "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          security import /tmp/markease-cert.p12 -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k actions "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build (PyInstaller)
        env:
          MK_TARGET_ARCH: ${{ matrix.arch }}
        run: |
          if [ "${{ matrix.target }}" = "linux-x64" ]; then
            python -m PyInstaller --clean --noconfirm packaging/linux.spec
          else
            python -m PyInstaller --clean --noconfirm packaging/macos.spec
          fi

      - name: Verify build output (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          test -x dist/MarkEase/MarkEase
          test -f dist/MarkEase/_internal/web/index.html
          xvfb-run -a dist/MarkEase/MarkEase --self-test
          dist/MarkEase/MarkEase --net-test

      - name: Verify build output (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          APP=dist/MarkEase.app
          test -d "$APP"
          test -f "$APP/Contents/Info.plist"
          test -f "$APP/Contents/MacOS/MarkEase"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
            "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c \
            'Print :CFBundleDocumentTypes:0:LSItemContentTypes:0' \
            "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c \
            'Print :UTExportedTypeDeclarations:0:UTTypeIdentifier' \
            "$APP/Contents/Info.plist"
          plutil -lint "$APP/Contents/Info.plist"
          "$APP/Contents/MacOS/MarkEase" --self-test
          "$APP/Contents/MacOS/MarkEase" --net-test

      - name: GUI smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          set +e
          timeout 45s xvfb-run -a dist/MarkEase/MarkEase --ui-test \
            2>&1 | tee /tmp/markease-ui-test.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::error::--ui-test failed with code $code"
            exit 1
          fi
          grep -q '"initialized": true' /tmp/markease-ui-test.log
          if grep -q '"toolbarButtons": 0' /tmp/markease-ui-test.log; then
            echo "::error::toolbar did not initialize"
            exit 1
          fi

      - name: GUI smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          set +e
          dist/MarkEase.app/Contents/MacOS/MarkEase --ui-test \
            2>&1 | tee /tmp/markease-ui-test.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::error::--ui-test failed with code $code"
            exit 1
          fi
          grep -q '"initialized": true' /tmp/markease-ui-test.log
          grep -q '"menubarVisible": true' /tmp/markease-ui-test.log

      - name: Find bar drag/bounds test (Linux)
        if: runner.os == 'Linux'
        run: |
          set +e
          timeout 45s xvfb-run -a dist/MarkEase/MarkEase --find-test \
            2>&1 | tee /tmp/markease-find-test.log
          code=${PIPESTATUS[0]}
          set -e
          cat /tmp/markease-find-test.log
          if [ "$code" -ne 0 ]; then
            echo "::error::--find-test failed with code $code"
            exit 1
          fi

      - name: Find bar drag/bounds test (macOS)
        if: runner.os == 'macOS'
        run: |
          set +e
          dist/MarkEase.app/Contents/MacOS/MarkEase --find-test \
            2>&1 | tee /tmp/markease-find-test.log
          code=${PIPESTATUS[0]}
          set -e
          cat /tmp/markease-find-test.log
          if [ "$code" -ne 0 ]; then
            echo "::error::--find-test failed with code $code"
            exit 1
          fi

      - name: PDF smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          set +e
          timeout 90s xvfb-run -a dist/MarkEase/MarkEase \
            --pdf-test /tmp/markease-test.pdf 2>&1 | tee /tmp/markease-pdf.log
          code=${PIPESTATUS[0]}
          set -e
          cat /tmp/markease-pdf.log
          if [ "$code" -ne 0 ]; then
            echo "::error::--pdf-test failed with code $code"
            exit 1
          fi
          test -s /tmp/markease-test.pdf

      - name: PDF smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          set +e
          dist/MarkEase.app/Contents/MacOS/MarkEase \
            --pdf-test /tmp/markease-test.pdf 2>&1 | tee /tmp/markease-pdf.log
          code=${PIPESTATUS[0]}
          set -e
          cat /tmp/markease-pdf.log
          if [ "$code" -ne 0 ]; then
            echo "::error::--pdf-test failed with code $code"
            exit 1
          fi
          test -s /tmp/markease-test.pdf

      - name: Close/quit smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          set +e
          dist/MarkEase.app/Contents/MacOS/MarkEase --close-test \
            2>&1 | tee /tmp/markease-close.log
          code=${PIPESTATUS[0]}
          set -e
          cat /tmp/markease-close.log
          if [ "$code" -ne 0 ]; then
            echo "::error::--close-test failed with code $code"
            exit 1
          fi

      - name: Open-file smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          set +e
          printf '# MarkEase open test\n\nhello\n' > /tmp/markease-open-test.md
          dist/MarkEase.app/Contents/MacOS/MarkEase \
            --open-file-test /tmp/markease-open-test.md \
            2>&1 | tee /tmp/markease-open-file.log
          code=${PIPESTATUS[0]}
          set -e
          cat /tmp/markease-open-file.log
          if [ "$code" -ne 0 ]; then
            echo "::error::--open-file-test failed with code $code"
            exit 1
          fi

      - name: Package
        env:
          MK_CODESIGN_IDENTITY: ${{ secrets.MAC_CODESIGN_IDENTITY }}
          MK_NOTARIZE: ${{ secrets.APPLE_ID != '' && '1' || '0' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          python packaging/package.py \
            --target ${{ matrix.target }} --dist dist --out out

      - name: Verify dmg contents (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          DMG=$(ls out/*.dmg)
          MOUNT=/tmp/markease_dmg
          mkdir -p "$MOUNT"
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT"
          trap 'hdiutil detach "$MOUNT" -force >/dev/null 2>&1 || true' EXIT
          test -d "$MOUNT/MarkEase.app"
          test -L "$MOUNT/Applications"
          test -f "$MOUNT/.DS_Store"
          find "$MOUNT" -iname '*background*' | grep -q .
          echo 'dmg layout assets: ok'

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: markease-${{ matrix.name }}
          path: |
            out/*.tar.gz
            out/*.deb
            out/*.dmg
            out/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
