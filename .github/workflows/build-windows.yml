name: Build Windows portable

# 说明：
#   - 这是 MarkEase 的 Windows 便携版 CI 构建入口：在 GitHub 托管的
#     windows-latest 上从源码构建，并产出可分发的 zip。
#   - 触发：手动 workflow_dispatch，或推送 v* 标签。
#   - 所有 action 均使用 Node 24 运行时（v7 系列），避免 Node 20 弃用警告。
#   - 如后续接入代码签名（SignPath / Azure Trusted Signing）或 Microsoft Store
#     打包，在 Upload 之后追加对应步骤即可。

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller python-docx lxml psutil

      - name: Build (PyInstaller)
        run: python -m PyInstaller --clean --noconfirm MarkEase.spec

      - name: Verify build output
        shell: pwsh
        run: |
          $exe = 'dist/MarkEase/MarkEase.exe'
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          if (-not (Test-Path 'dist/MarkEase/MarkEase.exe.config')) {
            throw 'missing MarkEase.exe.config (needed by pythonnet on non-ASCII paths)'
          }
          if (-not (Test-Path 'dist/MarkEase/_internal/pythonnet/runtime/Python.Runtime.dll')) {
            throw 'missing pythonnet runtime'
          }
          if (-not (Test-Path 'dist/MarkEase/_internal/web/index.html')) {
            throw 'missing web assets'
          }

      - name: Package portable zip
        shell: pwsh
        run: |
          $ver = python -c "import re;print('.'.join(re.search(r'filevers=\((\d+),\s*(\d+),\s*(\d+)', open('version_info.txt', encoding='utf-8').read()).groups()))"
          New-Item -ItemType Directory -Force out | Out-Null
          $zip = "out/MarkEase_v${ver}_Windows_x64_portable.zip"
          Compress-Archive -Path 'dist/MarkEase' -DestinationPath $zip -CompressionLevel Optimal
          Write-Host "artifact: $zip"
          Get-ChildItem out | Format-Table Name, Length

      - name: Upload unsigned artifact
        id: upload-unsigned
        uses: actions/upload-artifact@v7
        with:
          name: markease-unsigned
          path: out/*.zip
          if-no-files-found: error

      # 后续如需代码签名（SignPath / Azure Trusted Signing）或 Microsoft Store 打包，
      # 在这里追加对应步骤；当前只产出未签名便携包。
