name: Build Linux & macOS

# MarkEase 的 Linux / macOS 打包入口。
#
# - Linux  : ubuntu-22.04 上构建（glibc 较老，兼容更多发行版），产出 tar.gz + deb
# - macOS  : 分别在 macos-26-intel（x64）与 macos-26（Apple Silicon）上原生构建，
#            各产出一个 dmg，从而同时兼容 Intel 与 M 系列芯片
# - 所有平台共用同一份业务代码（app/platform 负责系统差异），无需维护三份分支
#
# 触发：手动 workflow_dispatch，或推送 v* 标签。
# 说明：Windows 仍由 build-windows.yml 构建，两个 workflow 互不重复。

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            target: linux-x64
            arch: ''
          - name: macos-x64
            os: macos-26-intel
            target: macos-x64
            arch: x86_64
          - name: macos-arm64
            os: macos-26
            target: macos-arm64
            arch: arm64

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    env:
      # 在 job 级暴露，才能用于 step 的 if 条件（GitHub 不允许 secrets 直接出现在 if）
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config gobject-introspection \
            libglib2.0-dev libgirepository1.0-dev libffi-dev \
            libcairo2-dev libpango1.0-dev \
            libgtk-3-dev libwebkit2gtk-4.0-dev \
            gir1.2-gtk-3.0 gir1.2-webkit2-4.0 \
            xvfb

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Import Developer ID certificate (optional)
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE_P12 != ''
        env:
          CERT_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN=/tmp/markease-signing.keychain
          echo "$CERT_P12" | base64 --decode > /tmp/markease-cert.p12
          security create-keychain -p actions "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          security import /tmp/markease-cert.p12 -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k actions "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build (PyInstaller)
        env:
          MK_TARGET_ARCH: ${{ matrix.arch }}
        run: |
          if [ "${{ matrix.target }}" = "linux-x64" ]; then
            python -m PyInstaller --clean --noconfirm packaging/linux.spec
          else
            python -m PyInstaller --clean --noconfirm packaging/macos.spec
          fi

      - name: Verify build output (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          test -x dist/MarkEase/MarkEase
          test -f dist/MarkEase/_internal/web/index.html
          echo '--- self-test ---'
          xvfb-run -a dist/MarkEase/MarkEase --self-test

      - name: Verify build output (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          APP=dist/MarkEase.app
          test -d "$APP"
          test -f "$APP/Contents/Info.plist"
          test -f "$APP/Contents/MacOS/MarkEase"
          echo '--- Info.plist ---'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
            "$APP/Contents/Info.plist"
          echo '--- self-test ---'
          "$APP/Contents/MacOS/MarkEase" --self-test

      # 真实启动一次窗口，确认 WebView 初始化不会崩溃。
      # 预期由 timeout 结束（124）；早退说明启动失败。
      - name: GUI smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          set +e
          timeout 25s xvfb-run -a dist/MarkEase/MarkEase \
            > /tmp/markease-gui.log 2>&1
          code=$?
          set -e
          cat /tmp/markease-gui.log || true
          if [ "$code" -ne 124 ]; then
            echo "::error::MarkEase exited early with code $code"
            exit 1
          fi
          echo 'GUI stayed alive for 25s (killed by timeout as expected)'

      - name: GUI smoke test (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          set +e
          dist/MarkEase.app/Contents/MacOS/MarkEase \
            > /tmp/markease-gui.log 2>&1 &
          pid=$!
          sleep 15
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "::error::MarkEase exited during startup"
            cat /tmp/markease-gui.log
            exit 1
          fi
          kill "$pid" 2>/dev/null
          wait "$pid" 2>/dev/null
          echo 'GUI stayed alive for 15s'

      - name: Package
        env:
          MK_CODESIGN_IDENTITY: ${{ secrets.MAC_CODESIGN_IDENTITY }}
          MK_NOTARIZE: ${{ secrets.APPLE_ID != '' && '1' || '0' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          python packaging/package.py \
            --target ${{ matrix.target }} --dist dist --out out

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: markease-${{ matrix.name }}
          path: |
            out/*.tar.gz
            out/*.deb
            out/*.dmg
            out/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
